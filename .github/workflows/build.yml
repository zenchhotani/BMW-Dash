name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Test road logic
        run: |
          mkdir -p /tmp/coretest
          javac -d /tmp/coretest app/src/main/java/com/zen/bmwdash/core/*.java tests/CoreTest.java
          java -cp /tmp/coretest CoreTest
      - name: Build
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee /tmp/build.log
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BMW-Dash.apk
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" BMW-Dash.apk --title "BMW Dash 1.0.${GITHUB_RUN_NUMBER}" --notes "Install BMW-Dash.apk on your phone." --latest
      # A copy on the apk-build branch gives a direct download and keeps the log of each run.
      - name: Publish build branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp /tmp/build.log /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/BMW-Dash.apk 2>/dev/null || true
          echo "run=${GITHUB_RUN_NUMBER} commit=${GITHUB_SHA} status=${{ job.status }}" > /tmp/out/status.txt
          cd /tmp/out
          git init -q -b apk-build
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Build ${GITHUB_RUN_NUMBER}"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-build
